<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get SayItSo</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
// One link for ads: sends each phone straight to its own store.
(function () {
  var q = new URLSearchParams(location.search);
  var camp = (q.get('c') || 'ig_ad').replace(/[^\w-]/g, '').slice(0, 40);
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  // pt/ct = App Store Connect campaign link, so installs show up under Analytics > Campaigns.
  var ios = 'https://apps.apple.com/app/apple-store/id6831498348?pt=129737723&ct=' + encodeURIComponent(camp) + '&mt=8';
  // c=ig_bio / fb_bio / tt_bio / yt_bio → organic; anything else (bf_test, ig_ad…) → paid.
  var src = { fb: 'facebook', tt: 'tiktok', yt: 'youtube' }[camp.split('_')[0]] || 'instagram';
  var medium = /_bio$/.test(camp) ? 'social' : 'paid';
  var play = 'https://play.google.com/store/apps/details?id=com.miraenangdok.app&referrer=' +
    encodeURIComponent('utm_source=' + src + '&utm_medium=' + medium + '&utm_campaign=' + camp);
  if (isIOS) location.replace(ios);
  else if (isAndroid) location.replace(play);
  else location.replace('/');
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:48px 16px">
<p>Opening the store…</p>
<p><a href="https://apps.apple.com/app/id6831498348">App Store</a> · <a href="https://play.google.com/store/apps/details?id=com.miraenangdok.app">Google Play</a></p>
</body>
</html>
